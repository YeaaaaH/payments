version: '3.8'

services:
  postgres:
    image: postgres
    container_name: postgres
    restart: always
    volumes:
      - project_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
  api:
    build: .
    container_name: api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SECRET: secret
      EXPIRE_TIME: 600000
    ports:
      - 8080:8080
    depends_on:
      - postgres

volumes:
  project_data: